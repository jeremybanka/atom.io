blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Consumed jeremybanka packages are exempt at every version.
  # Keep aligned with the npm rule in renovate.json.
  - "@breakage/changesets"
  - "@correctlyjs/schemars"
  - atom.io
  - breakage
  - comline
  - correctly
  - galley.md
  - lasertag
  - rationality
  - recoverage
  - takua
  - tonnage
  - treetrunks
  - tsdoc.json

autoInstallPeers: false
verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"

allowBuilds:
  "@vscode/vsce-sign": true
  dprint: true
  "esbuild": true
  keytar: true
  "rolldown": true
  "sharp": true
  simple-git-hooks: false
  "unrs-resolver": true
  "workerd": true
