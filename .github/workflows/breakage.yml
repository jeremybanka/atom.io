name: Breakage

on:
  push:
    branches: ["main"]
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}

defaults:
  run:
    shell: bash

jobs:
  PeerCoverage:
    name: All Peer Eras Represented
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - id: prepare
        run: |
          matrix=$(pnpm --filter atom.io exec breakage npm plan --root ../.. --config packages/atom.io/breakage.config.ts --out .breakage/peer-bundle)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  PeerEnvironment:
    name: ${{ matrix.label }}
    needs: PeerCoverage
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.PeerCoverage.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle
      - run: pnpm --filter atom.io exec breakage npm execute "$PEER_ENVIRONMENT_ID" --root ../.. --plan .breakage/peer-bundle/plan.json --receipt ".breakage/peer-receipts/$PEER_ENVIRONMENT_ID.json"
        env:
          PEER_ENVIRONMENT_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: breakage-peer-receipt-${{ matrix.id }}
          path: .breakage/peer-receipts/${{ matrix.id }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  Peers:
    name: Peers
    if: ${{ always() }}
    needs: [PeerCoverage, PeerEnvironment]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: test "$COVERAGE_RESULT" = success && test "$ENVIRONMENT_RESULT" = success
        env:
          COVERAGE_RESULT: ${{ needs.PeerCoverage.result }}
          ENVIRONMENT_RESULT: ${{ needs.PeerEnvironment.result }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          packages: node pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: breakage-peer-receipt-*
          path: .breakage/peer-receipts
      - run: pnpm --filter atom.io exec breakage npm verify --root ../.. --plan .breakage/peer-bundle/plan.json --receipts '.breakage/peer-receipts/**/*.json'

  Public:
    name: Public
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"
          port: "59432"
      - run: pnpm test:breakage
