name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "mosaic-domains"]
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}

defaults:
  run:
    shell: bash

jobs:
  Vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ATOM_IO_TEST_POSTGRES_SKIP_MISE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"
          port: "59432"
      - run: pnpm run test

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: pnpm run build
      - run: pnpm --filter atom.io test:react-types-peer

  Manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: pnpm run manifest:test

  BreakageHistory:
    name: Breakage Public
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"
          port: "59432"
      - run: pnpm test:breakage

  PeerPrologue:
    name: Breakage Peers
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: node --test scripts/breakage-receipts.test.ts
      - id: prepare
        run: node scripts/breakage-ci.ts prologue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  PeerEnvironment:
    name: ${{ matrix.label }}
    needs: PeerPrologue
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.PeerPrologue.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle
      - run: node scripts/breakage-ci.ts test "$PEER_ENVIRONMENT_ID"
        env:
          PEER_ENVIRONMENT_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: breakage-peer-receipt-${{ matrix.id }}
          path: .breakage/peer-receipts/${{ matrix.id }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  Breakage:
    name: Breakage
    if: ${{ always() }}
    needs: [BreakageHistory, PeerPrologue, PeerEnvironment]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: node pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breakage-peer-plan
          path: .breakage/peer-bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: breakage-peer-receipt-*
          path: .breakage/peer-receipts
      - run: node scripts/breakage-ci.ts epilogue
        if: ${{ always() }}
        env:
          BREAKAGE_NEEDS: ${{ toJSON(needs) }}
