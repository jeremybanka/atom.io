blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Approved for the stable Solid 2 migration. Keep this exception version-specific.
  - "@solidjs/vite-plugin@3.0.0"
  # Consumed jeremybanka packages are exempt at every version.
  # Keep aligned with the npm rule in renovate.json.
  - "@breakage/changesets"
  - "@correctlyjs/schemars"
  - atom.io
  - breakage
  - comline
  - correctly
  - dprint-plugin-mdx
  - galley.md
  - lasertag
  - rationality
  - recoverage
  - takua
  - tonnage
  - treetrunks
  - tsdoc.json

autoInstallPeers: false
verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"

allowBuilds:
  "@vscode/vsce-sign": true
  dprint: true
  "esbuild": true
  keytar: true
  "rolldown": true
  "sharp": true
  simple-git-hooks: false
  "unrs-resolver": true
  "workerd": true

# TypeScript ESLint v8 uses compiler internals removed in TypeScript 7.
# Keep its compiler dependency isolated until the v8 stack supports TypeScript 7.
include:
  ./pnpm-peer-compatibility.yaml: [overrides]

packageExtensions:
  "typescript-eslint@8": &eslint-typescript6
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/eslint-plugin@8": *eslint-typescript6
  "@typescript-eslint/parser@8": *eslint-typescript6
  "@typescript-eslint/project-service@8": *eslint-typescript6
  "@typescript-eslint/rule-tester@8": *eslint-typescript6
  "@typescript-eslint/tsconfig-utils@8": *eslint-typescript6
  "@typescript-eslint/type-utils@8": *eslint-typescript6
  "@typescript-eslint/typescript-estree@8": *eslint-typescript6
  "@typescript-eslint/utils@8": *eslint-typescript6
