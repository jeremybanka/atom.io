blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Temporary pnpm 12.15.0 exception for Renovate; remove after 2026-10-22 11:17 UTC.
  - pnpm@12.15.0
  - "@pnpm/exe.android-arm64@12.15.0"
  - "@pnpm/exe.android-x64@12.15.0"
  - "@pnpm/exe.darwin-arm64@12.15.0"
  - "@pnpm/exe.darwin-x64@12.15.0"
  - "@pnpm/exe.freebsd-x64@12.15.0"
  - "@pnpm/exe.linux-arm64-musl@12.15.0"
  - "@pnpm/exe.linux-arm64@12.15.0"
  - "@pnpm/exe.linux-ppc64@12.15.0"
  - "@pnpm/exe.linux-riscv64@12.15.0"
  - "@pnpm/exe.linux-s390x@12.15.0"
  - "@pnpm/exe.linux-x64-musl@12.15.0"
  - "@pnpm/exe.linux-x64@12.15.0"
  - "@pnpm/exe.win32-arm64@12.15.0"
  - "@pnpm/exe.win32-x64@12.15.0"
  # Permit the verified eMudhra security patch before the usual release-age delay.
  - dprint@0.64.1
  - "@dprint/android-arm64@0.64.1"
  - "@dprint/android-x64@0.64.1"
  - "@dprint/darwin-arm64@0.64.1"
  - "@dprint/darwin-x64@0.64.1"
  - "@dprint/freebsd-arm64@0.64.1"
  - "@dprint/freebsd-x64@0.64.1"
  - "@dprint/linux-arm64-glibc@0.64.1"
  - "@dprint/linux-arm64-musl@0.64.1"
  - "@dprint/linux-loong64-glibc@0.64.1"
  - "@dprint/linux-loong64-musl@0.64.1"
  - "@dprint/linux-ppc64-glibc@0.64.1"
  - "@dprint/linux-ppc64-musl@0.64.1"
  - "@dprint/linux-riscv64-glibc@0.64.1"
  - "@dprint/linux-riscv64-musl@0.64.1"
  - "@dprint/linux-s390x-glibc@0.64.1"
  - "@dprint/linux-x64-glibc@0.64.1"
  - "@dprint/linux-x64-musl@0.64.1"
  - "@dprint/win32-arm64@0.64.1"
  - "@dprint/win32-x64@0.64.1"
  - "@correctlyjs/schemars"
  - atom.io
  - break-check
  - breakage
  - bun-types
  - comline
  - correctly
  - galley.md@0.1.1
  - lasertag
  - recoverage
  - takua
  - tonnage
  - treetrunks
autoInstallPeers: false
verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"

allowBuilds:
  "@vscode/vsce-sign": true
  dprint: true
  "esbuild": true
  keytar: true
  "rolldown": true
  "sharp": true
  simple-git-hooks: false
  "unrs-resolver": true
  "workerd": true
