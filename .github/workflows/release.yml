name: Release

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Release:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PK_2OJEM1SH }}
          owner: jeremybanka
          repositories: atom.io
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        id: changesets
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # This expects you to have a script called changes:publish which does a build for your packages and calls changeset publish
          publish-script: bun run changes:publish
          version-script: bun run changes:version
