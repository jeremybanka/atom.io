name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}

defaults:
  run:
    shell: bash

jobs:
  Vitest:
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    env:
      ATOM_IO_TEST_POSTGRES_SKIP_MISE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - uses: ./.github/actions/setup-postgres
      - run: pnpm run test

  Build:
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: pnpm run build
      - run: pnpm test:packaging

  BrowserSuites:
    name: Browser Tests (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: editor
            name: Editor
            build_filters: --filter=@atom.io/realtime...
            directory: templates/react-realtime-text-editor
            playwright_module: "@playwright/test"
          - suite: spa
            name: SPA
            build_filters: --filter=@atom.io/spa... --filter=resumability...
            directory: packages/spa
            playwright_module: playwright
          - suite: astro
            name: Astro Starter
            build_filters: --filter=@atom.io/template-spa-astro-ssr^...
            directory: templates/spa-astro-ssr
            playwright_module: playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: pnpm exec turbo run build ${{ matrix.build_filters }}
      - name: Resolve Playwright version
        id: playwright
        working-directory: ${{ matrix.directory }}
        run: node -p '"version=" + require("${{ matrix.playwright_module }}/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-headless-${{ steps.playwright.outputs.version }}
      # Keep the install on cache hits to verify the required browser and FFmpeg
      # are present. Headless tests do not need the full Chromium download.
      - name: Install Chromium headless shell
        working-directory: ${{ matrix.directory }}
        run: pnpm exec playwright install --only-shell chromium
      - name: Verify Chromium system dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          check_browser() {
            node --input-type=module -e '
              import { chromium } from "${{ matrix.playwright_module }}"
              const browser = await chromium.launch()
              await browser.close()
            '
          }
          # Hosted runners already provide Chromium libraries. Probe every run:
          # restoring browser files does not restore system packages.
          if ! check_browser; then
            pnpm exec playwright install-deps chromium
            check_browser
          fi
      - run: pnpm --filter @atom.io/template-react-realtime-text-editor test:browser
        if: matrix.suite == 'editor'
      - run: pnpm --filter @atom.io/spa test:browser
        if: matrix.suite == 'spa'
      - run: pnpm --filter @atom.io/spa test:browser:motion
        if: matrix.suite == 'spa'
      - run: pnpm --filter @atom.io/spa test:browser:floating
        if: matrix.suite == 'spa'
      - name: Upload motion capture
        if: always() && matrix.suite == 'spa'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-motion-capture
          path: |
            /tmp/spa-motion-*.png
            /tmp/spa-motion-*.json
          retention-days: 7
      - run: pnpm --filter resumability test:browser
        if: matrix.suite == 'spa'
      - run: pnpm --filter @atom.io/template-spa-astro-ssr test:browser
        if: matrix.suite == 'astro'

  BrowserTests:
    name: Browser Tests
    needs: BrowserSuites
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Require all browser suites to pass
        env:
          RESULT: ${{ needs.BrowserSuites.result }}
        run: test "$RESULT" = success

  Manifest:
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm
      - run: pnpm run manifest:test
